[package]
name = "zk-aes"
version = "0.1.0"
edition = "2021"
description = "A zero-knowledge proof of AES-128 ECB encryption, on Arkworks."

[dependencies]
# Constraint systems and gadgets.
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
ark-r1cs-std = { version = "0.5", default-features = false }
ark-bls12-377 = { version = "0.5", default-features = false, features = ["curve"] }

# Proving systems. Spartan is pinned: its master has moved to Arkworks 0.6.
ark-snark = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
libspartan = { package = "ark-spartan", git = "https://github.com/arkworks-rs/spartan", rev = "e0aff4c4b7d1ef965bc862da6ec426e162cc3de8" }
merlin = "3.0"

# The reference AES, randomness and errors.
aes = "0.8"
rand_chacha = "0.3"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.4"

[[bench]]
name = "benchmark"
harness = false

# The proving tests are unusably slow unoptimized.
[profile.test]
opt-level = 3
